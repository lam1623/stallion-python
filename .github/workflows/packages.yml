name: Packages and releases

# Builds the .deb, .rpm, Arch and portable packages and installs each one on fresh containers of
# its distributions. A version with no release yet (__version__ in stallion/__init__.py) that
# reaches master, or a v* tag, then becomes a GitHub release with every package, and the Docker
# image goes to ghcr.io for amd64 and arm64.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/linux/**"
      - ".github/workflows/packages.yml"
      - ".github/release-notes.md"
      - "pyproject.toml"
      - "stallion/__init__.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  # A release in progress on master or a tag always runs to the end; runs on PRs are replaced
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/linux/Dockerfile
          outputs: type=local,dest=dist/linux
          cache-from: type=gha,scope=linux-packages
          cache-to: type=gha,scope=linux-packages,mode=max
      - name: Match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -f "dist/linux/stallion_${GITHUB_REF_NAME#v}-1_amd64.deb"
      - run: ls -l dist/linux && cat dist/linux/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/linux
          compression-level: 0
          retention-days: 30

  test:
    name: Test on ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            id: ubuntu-24.04
            image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./stallion_*_amd64.deb curl procps xvfb imagemagick
          - name: Ubuntu 22.04
            id: ubuntu-22.04
            image: ubuntu:22.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./stallion_*_amd64.deb curl procps xvfb imagemagick
          - name: Debian 12
            id: debian-12
            image: debian:12
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./stallion_*_amd64.deb curl procps xvfb imagemagick
          - name: Fedora 42
            id: fedora-42
            image: fedora:42
            install: dnf install -y ./stallion-*.x86_64.rpm curl procps-ng xorg-x11-server-Xvfb ImageMagick
          - name: openSUSE Tumbleweed
            id: opensuse-tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            install: zypper --non-interactive install --allow-unsigned-rpm ./stallion-*.x86_64.rpm curl procps xorg-x11-server-Xvfb ImageMagick
          - name: Arch Linux
            id: archlinux
            image: archlinux:latest
            install: pacman -Syu --noconfirm && pacman -U --noconfirm ./stallion-*-x86_64.pkg.tar.zst && pacman -S --noconfirm --needed curl procps-ng xorg-server-xvfb imagemagick
          - name: the portable tarball
            id: portable
            image: debian:12
            portable: 1
            # The .deb only brings in the libraries: the tarball's own copy is what runs
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./stallion_*_amd64.deb curl procps xvfb imagemagick && dpkg -r stallion && tar -xzf stallion-*-linux-x86_64.tar.gz -C "$HOME" && "$HOME"/stallion-*-linux-x86_64/install.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: pkg
      - name: Install and try it
        env:
          IMAGE: ${{ matrix.image }}
          INSTALL: ${{ matrix.install }}
          PORTABLE: ${{ matrix.portable || 0 }}
        run: |
          docker run --rm -v "$PWD/pkg:/pkg" -v "$PWD/packaging/linux/smoke-test.sh:/smoke-test.sh:ro" -w /pkg \
            -e PORTABLE -e SCREENSHOT=/pkg/window.png "$IMAGE" sh -c "$INSTALL && sh /smoke-test.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-${{ matrix.id }}
          path: pkg/window.png
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish the release
    # Only once every package passed on every distribution
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/linux
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          deb=$(basename dist/linux/stallion_*-1_amd64.deb)
          version=${deb#stallion_}
          version=${version%-1_amd64.deb}
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" != tag ]; then
              echo "$tag is already released: bump __version__ in stallion/__init__.py for a new release"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A release drafted on GitHub for the tag gets the packages attached
            gh release upload "$tag" dist/linux/* --clobber
          else
            sed "s/@VERSION@/$version/g" .github/release-notes.md > notes.md
            gh release create "$tag" dist/linux/* --target "$GITHUB_SHA" \
              --title "Stallion $version" --notes-file notes.md --generate-notes
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

  docker:
    name: Publish the Docker image
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.description=Friendly video and audio converter powered by FFmpeg
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,scope=docker-release,mode=max
      - name: Try the published image on both platforms
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$IMAGE:$VERSION" stallion --version
            docker run --rm --platform "$platform" --entrypoint ffmpeg "$IMAGE:$VERSION" -hide_banner -version
          done
