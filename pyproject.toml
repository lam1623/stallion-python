[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stallion"
version = "4.0.0"
description = "Modern FFmpeg video and audio converter with a web UI that runs as a desktop app or in Docker"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lino Alfonso" }]
keywords = ["ffmpeg", "video", "converter", "transcoder", "subtitles"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "platformdirs>=4,<5",
  "psutil>=5.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Native window; on Linux the Qt backend installs cleanly from wheels
desktop = ["pywebview>=5.3", "pywebview[qt]>=5.3; sys_platform == 'linux'"]
dev = ["pytest>=8,<9", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
stallion = "stallion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["stallion"]
# The SPA bundle is gitignored but must ship inside the wheel
artifacts = ["stallion/web/dist/**"]

[tool.hatch.build.targets.sdist]
include = ["stallion", "tests", "README.md", "pyproject.toml"]
artifacts = ["stallion/web/dist/**"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ffmpeg: needs real ffmpeg/ffprobe binaries"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
packages = ["stallion"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
